<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="t" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title id="t">Block diagram of the VLM-grounded, memory- and gripper-aware planner</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16191d"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f4f8f"/></marker>
  </defs>
  <rect width="1200" height="600" fill="#f3f4f5"/>

  <!-- additions marker -->
  <rect x="670" y="265" width="370" height="295" fill="none" stroke="#1f4f8f" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="682" y="255" font-size="14" fill="#1f4f8f">Added in this work</text>

  <!-- inputs -->
  <g font-size="16" fill="#16191d">
    <text x="40" y="137">RGB observation</text>
    <text x="40" y="337">Language instruction</text>
  </g>
  <g fill="none" stroke="#16191d" stroke-width="2" marker-end="url(#a)">
    <path d="M180 132H318"/>
    <path d="M215 332H318"/>
  </g>

  <!-- boxes -->
  <g fill="#f3f4f5" stroke="#16191d" stroke-width="2">
    <rect x="320" y="90" width="320" height="84"/>
    <rect x="320" y="290" width="320" height="84"/>
    <rect x="1060" y="290" width="120" height="84"/>
  </g>
  <g fill="#f3f4f5" stroke="#1f4f8f" stroke-width="2">
    <rect x="690" y="290" width="330" height="84"/>
    <rect x="690" y="460" width="330" height="80"/>
  </g>
  <g font-size="18" font-weight="600" fill="#16191d" text-anchor="middle">
    <text x="480" y="128">Visual grounding</text>
    <text x="480" y="328">Language-conditioned planner</text>
    <text x="855" y="328">Gripper-aware grasp selection</text>
    <text x="1120" y="328">Execution</text>
    <text x="855" y="496">Execution memory</text>
  </g>
  <g font-size="14" fill="#545b61" text-anchor="middle">
    <text x="480" y="154">VLM: objects and spatial relations</text>
    <text x="480" y="354">task-level plan</text>
    <text x="855" y="354">filtered by gripper constraints</text>
    <text x="1120" y="354">trajectory</text>
    <text x="855" y="522">outcome of the previous attempt</text>
  </g>

  <!-- flow -->
  <g fill="none" stroke="#16191d" stroke-width="2" marker-end="url(#a)">
    <path d="M480 174V288"/>
    <path d="M640 332H688"/>
    <path d="M1020 332H1058"/>
    <path d="M1120 374V500H1022"/>
  </g>
  <path d="M690 500H480V376" fill="none" stroke="#1f4f8f" stroke-width="2" marker-end="url(#at)"/>

  <g font-size="14" font-style="italic" fill="#545b61">
    <text x="492" y="236">grounded scene</text>
    <text x="664" y="320" text-anchor="middle">plan</text>
    <text x="1130" y="445">feedback</text>
    <text x="492" y="445" fill="#1f4f8f">memory</text>
  </g>
</svg>
