<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title id="t">Block diagram of the demonstration-to-rollout pipeline</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16191d"/></marker>
  </defs>
  <rect width="1200" height="520" fill="#f3f4f5"/>

  <!-- responsibility regions -->
  <rect x="20" y="145" width="310" height="230" fill="none" stroke="#a7abb0" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="32" y="135" font-size="14" fill="#545b61">Team: teleoperation hardware and electronics</text>
  <rect x="350" y="145" width="830" height="230" fill="none" stroke="#1f4f8f" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="362" y="135" font-size="14" fill="#1f4f8f">My role (Learning Lead): demonstration-to-rollout loop</text>

  <!-- boxes -->
  <g fill="#f3f4f5" stroke="#16191d" stroke-width="2">
    <rect x="40" y="205" width="270" height="90"/>
    <rect x="380" y="205" width="240" height="90"/>
    <rect x="680" y="205" width="280" height="90"/>
    <rect x="1010" y="205" width="160" height="90"/>
  </g>
  <g font-size="18" font-weight="600" fill="#16191d" text-anchor="middle">
    <text x="175" y="243">Leader-arm teleoperation</text>
    <text x="500" y="243">Demonstration dataset</text>
    <text x="820" y="243">Imitation-learning policy</text>
    <text x="1090" y="243">RB10 rollouts</text>
  </g>
  <g font-size="14" fill="#545b61" text-anchor="middle">
    <text x="175" y="270">force feedback to the operator</text>
    <text x="500" y="270">collection and curation</text>
    <text x="820" y="270">training per task setup</text>
    <text x="1090" y="270">real-robot evaluation</text>
  </g>
  <text x="175" y="335" font-size="14" fill="#545b61" text-anchor="middle">three task setups</text>

  <!-- forward arrows -->
  <g fill="none" stroke="#16191d" stroke-width="2" marker-end="url(#a)">
    <path d="M310 250H378"/>
    <path d="M620 250H678"/>
    <path d="M960 250H1008"/>
  </g>

  <!-- iteration feedback -->
  <path d="M1090 295V440H820V297" fill="none" stroke="#16191d" stroke-width="2" marker-end="url(#a)"/>
  <text x="955" y="468" font-size="14" font-style="italic" fill="#545b61" text-anchor="middle">failure diagnosis and model iteration</text>
</svg>
